name: Despublicar posts no WordPress

# Botão manual: volta posts do WordPress para rascunho (não apaga).
on:
  workflow_dispatch:
    inputs:
      slugs:
        description: 'Slugs separados por vírgula'
        required: true
        default: 'masteron-para-que-serve,masteron-efeitos-colaterais,retatrutida,retatrutida-efeitos-colaterais,retatrutida-massa-muscular,retatrutida-ou-mounjaro'
        type: string

jobs:
  despublicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Despublicar
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          SLUGS: ${{ inputs.slugs }}
        run: node scripts/wp-despublicar.mjs
