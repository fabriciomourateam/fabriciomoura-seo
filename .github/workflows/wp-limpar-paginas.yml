name: Limpar páginas do WordPress

# Botão manual: tira Mounjaro/GLP-1 das páginas sobre, termos, links e calculadora do WordPress.
on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: 'Gravar no WordPress? (false = só simula)'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Limpar
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          APLICAR: ${{ inputs.aplicar }}
        run: node scripts/wp-limpar-paginas.mjs
